    .num { font-size: 44px; font-weight: 700; }
    .label { font-size: 18px; fill: #59636e; }
    .old { fill: #bc4c00; }
    .new { fill: #0969da; }
  </style>
  <rect width="1000" height="420" fill="#ffffff"/>
  <rect width="1000" height="10" fill="#0969da"/>
  <text x="56" y="92" font-size="40" font-weight="700">TITLE, FIRST LINE</text>
  <text x="56" y="140" font-size="40" font-weight="700">TITLE, SECOND LINE</text>
  <rect x="56" y="172" width="888" height="92" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="80" y="210" class="mono old">BEFORE: A REAL INPUT</text>
