<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <!-- dev.to cover, 1000×420; render at 2× with render.sh. Slots in CAPS. Colours: match the article's charts. -->
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1b1f24; }
